name: update-stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch stars and avatars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-stats.mjs
      - name: Commit data
        run: |
          git config user.name "rtdocs-bot"
          git config user.email "rtdocs-bot@users.noreply.github.com"
          git add data/repos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: 更新 Star 数据"
          git push
